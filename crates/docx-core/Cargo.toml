[package]
name = "docx-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared native Rust and WebAssembly parsing for DOCX and legacy Word documents"
repository = "https://github.com/extend-hq/react-docx"
readme = "README.md"
include = ["src/**", "examples/parse_blocks.rs", "README.md", "third-party/**", "LICENSE", "Cargo.toml"]

[features]
default = ["native-deflate"]
native-deflate = ["dep:libdeflater"]

[dependencies]
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
serde_bytes.workspace = true
miniz_oxide.workspace = true
memchr = "2"
zlib-rs = "0.6.8"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case"] }
quick-xml = "0.42"
base64 = "0.22"
roxmltree = "0.20"
sha2 = "0.10"
unicode-segmentation = "=1.12.0"

[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libdeflater = { version = "1.26.1", optional = true }

[dev-dependencies]
