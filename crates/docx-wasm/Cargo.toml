[package]
name = "react-docx-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Browser runtime for the React DOCX viewer"
repository = "https://github.com/extend-hq/react-docx"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rust-docx-wasm = { git = "https://github.com/extend-hq/rust-office.git", rev = "5ed8521ccc8821358c691356662ac4b1fc2f798a", version = "=0.2.17" }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-simd"]
